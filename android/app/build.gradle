apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStoreFile).exists()
def requireReleaseSigning = "true".equalsIgnoreCase(System.getenv("REQUIRE_RELEASE_SIGNING") ?: "")
def requestedReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.US).contains("release") }

if ((requireReleaseSigning || requestedReleaseTask) && !hasReleaseSigning) {
    throw new GradleException(
        "Релизная сборка Android требует постоянный keystore (ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Для локальной отладки используй pack:android:debug."
    )
}

def pkgJsonFile = file("../../package.json")
def pkgVersionFallback = "1.0.0"
if (pkgJsonFile.exists()) {
    try {
        def parsedPkg = new JsonSlurper().parse(pkgJsonFile)
        if (parsedPkg?.version) {
            pkgVersionFallback = parsedPkg.version.toString().trim()
        }
    } catch (Exception ignored) {
        logger.info("Could not parse root package.json version; falling back to 1.0.0.")
    }
}

def computeDefaultVersionCode = { String ver ->
    def parts = ver.split(/[^0-9]+/).findAll { it }.collect { Integer.parseInt(it) }
    def maj = parts.size() > 0 ? parts[0] : 1
    def min = parts.size() > 1 ? parts[1] : 0
    def pat = parts.size() > 2 ? parts[2] : 0
    def base = Math.max(1, maj * 10000 + min * 100 + pat)
    return base * 10000
}

def appVersionName = project.hasProperty("kapsulaVersionName") ? project.property("kapsulaVersionName").toString() : pkgVersionFallback
def appVersionCode = project.hasProperty("kapsulaVersionCode") ? Integer.parseInt(project.property("kapsulaVersionCode").toString()) : computeDefaultVersionCode(appVersionName)

android {
    namespace = "com.notesplus.kapsula"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.notesplus.kapsula"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions += "distribution"
    productFlavors {
        play {
            dimension "distribution"
            buildConfigField "String", "DIST_CHANNEL", "\"play\""
            buildConfigField "boolean", "ALLOW_SELF_UPDATE", "false"
        }
        direct {
            dimension "distribution"
            buildConfigField "String", "DIST_CHANNEL", "\"direct\""
            buildConfigField "boolean", "ALLOW_SELF_UPDATE", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.window:window:1.3.0"
    implementation "androidx.window:window-java:1.3.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
