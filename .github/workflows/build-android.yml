name: Build Kapsula Android (.apk)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Тип сборки Android APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (${{ github.event.inputs.variant || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 Platform & Build-Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Decode optional Android release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/kapsula-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/kapsula-release.jks" >> "$GITHUB_ENV"

      - name: Enforce persistent release keystore on v* tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && (secrets.ANDROID_KEYSTORE_BASE64 == '' || secrets.ANDROID_KEYSTORE_PASSWORD == '' || secrets.ANDROID_KEY_ALIAS == '' || secrets.ANDROID_KEY_PASSWORD == '') }}
        run: |
          echo "::error::Для публикации релиза по тегу v* требуется постоянный Android keystore (секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), чтобы APK можно было обновлять поверх установленного."
          exit 1

      - name: Note debug signing on manual workflow dispatch without keystore
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 не задан — тестовый APK будет подписан временным debug-ключом раннера. Для релизных сборок с обновлением поверх добавь ANDROID_KEYSTORE_* в секреты репозитория."

      - name: Build Android .apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          TARGET_VARIANT: ${{ github.event.inputs.variant || 'release' }}
        run: |
          node scripts/pack-android.mjs --variant="$TARGET_VARIANT"

      - name: Verify generated .apk signature, SHA-256 & android-latest.json
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          IS_TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        run: |
          ls -lh release/*.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/*.apk
          (cd release && sha256sum *.apk > SHA256SUMS-android.txt)
          cat release/SHA256SUMS-android.txt
          node --input-type=module << 'EOF'
          import { execFileSync } from 'node:child_process';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const releaseDir = path.resolve('release');
          const apks = fs.readdirSync(releaseDir).filter((f) => f.endsWith('.apk')).sort();
          const fileName = apks.find((f) => f.includes('-release.apk')) || apks[0];
          if (!fileName) {
            throw new Error('No .apk found in release/');
          }
          const apkPath = path.join(releaseDir, fileName);
          const aapt2 = path.join(process.env.ANDROID_HOME, 'build-tools', '36.0.0', 'aapt2');
          const badging = execFileSync(aapt2, ['dump', 'badging', apkPath], { encoding: 'utf8' });
          const nameMatch = badging.match(/versionName='([^']+)'/);
          const codeMatch = badging.match(/versionCode='(\d+)'/);
          if (!nameMatch || !codeMatch) {
            throw new Error(`Failed to parse versionName/versionCode from aapt2 output:\n${badging.slice(0, 400)}`);
          }

          const versionName = nameMatch[1];
          const versionCode = Number.parseInt(codeMatch[1], 10);
          if (!Number.isInteger(versionCode) || versionCode <= 0) {
            throw new Error(`Invalid versionCode parsed from APK: ${codeMatch[1]}`);
          }

          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(apkPath)).digest('hex');
          const releaseTag =
            process.env.IS_TAG_BUILD === 'true' && process.env.GITHUB_REF_NAME
              ? process.env.GITHUB_REF_NAME
              : `v${versionName}`;

          const metadata = {
            versionName,
            versionCode,
            fileName,
            sha256,
            releaseTag,
            builtAt: new Date().toISOString(),
          };
          const outPath = path.join(releaseDir, 'android-latest.json');
          fs.writeFileSync(outPath, JSON.stringify(metadata, null, 2) + '\n', 'utf8');
          console.log('--- release/android-latest.json ---');
          console.log(fs.readFileSync(outPath, 'utf8').trim());
          EOF

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kapsula-Android-apk
          path: |
            release/*.apk
            release/SHA256SUMS-android.txt
            release/android-latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Ensure GitHub Release exists (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXTRA_ARGS=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --title "Kapsula $RELEASE_TAG" --generate-notes "${EXTRA_ARGS[@]}" || true
          fi

      - name: Attach .apk & android-latest.json to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/SHA256SUMS-android.txt
            release/android-latest.json
