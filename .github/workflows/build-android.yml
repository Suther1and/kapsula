name: Build Kapsula Android (.apk / .aab)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Канал дистрибуции Android'
        required: true
        default: 'direct'
        type: choice
        options:
          - direct
          - play
      variant:
        description: 'Тип сборки Android'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      format:
        description: 'Формат пакета'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (${{ github.event.inputs.flavor || 'direct' }} / ${{ github.event.inputs.variant || 'release' }} / ${{ github.event.inputs.format || 'apk' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup & install Android SDK 36 Platform & Build-Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Prepare & validate Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TARGET_VARIANT: ${{ github.event.inputs.variant || 'release' }}
        run: |
          if [ "$TARGET_VARIANT" = "release" ]; then
            if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "::error::Релизная сборка Android требует постоянный keystore (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
              exit 1
            fi
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/kapsula-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/kapsula-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android artifact
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
          REQUIRE_RELEASE_SIGNING: ${{ (github.event.inputs.variant || 'release') == 'release' && 'true' || 'false' }}
          TARGET_FLAVOR: ${{ github.event.inputs.flavor || 'direct' }}
          TARGET_VARIANT: ${{ github.event.inputs.variant || 'release' }}
          TARGET_FORMAT: ${{ github.event.inputs.format || 'apk' }}
        run: |
          node scripts/pack-android.mjs --flavor="$TARGET_FLAVOR" --variant="$TARGET_VARIANT" --format="$TARGET_FORMAT"

      - name: Verify generated Android signature & android-latest.json
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          IS_TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          TARGET_FORMAT: ${{ github.event.inputs.format || 'apk' }}
        run: |
          if [ "$TARGET_FORMAT" = "aab" ]; then
            ls -lh release/*.aab
            jarsigner -verify -verbose -certs release/*.aab
          else
            ls -lh release/*.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/*.apk
            node --input-type=module << 'EOF'
            import { execFileSync } from 'node:child_process';
            import crypto from 'node:crypto';
            import fs from 'node:fs';
            import path from 'node:path';

            const releaseDir = path.resolve('release');
            const apks = fs.readdirSync(releaseDir).filter((f) => f.endsWith('.apk')).sort();
            const fileName =
              apks.find((f) => /-android\.apk$/i.test(f)) ||
              apks.find((f) => f.includes('-release.apk')) ||
              apks[0];
            if (!fileName) {
              throw new Error('No .apk found in release/');
            }
            const apkPath = path.join(releaseDir, fileName);
            const aapt2 = path.join(process.env.ANDROID_HOME, 'build-tools', '36.0.0', 'aapt2');
            const badging = execFileSync(aapt2, ['dump', 'badging', apkPath], { encoding: 'utf8' });
            const nameMatch = badging.match(/versionName='([^']+)'/);
            const codeMatch = badging.match(/versionCode='(\d+)'/);
            if (!nameMatch || !codeMatch) {
              throw new Error(`Failed to parse versionName/versionCode from aapt2 output:\n${badging.slice(0, 400)}`);
            }

            const versionName = nameMatch[1];
            const versionCode = Number.parseInt(codeMatch[1], 10);
            if (!Number.isInteger(versionCode) || versionCode <= 0) {
              throw new Error(`Invalid versionCode parsed from APK: ${codeMatch[1]}`);
            }

            const sha256 = crypto.createHash('sha256').update(fs.readFileSync(apkPath)).digest('hex');
            const releaseTag =
              process.env.IS_TAG_BUILD === 'true' && process.env.GITHUB_REF_NAME
                ? process.env.GITHUB_REF_NAME
                : `v${versionName}`;

            const metadata = {
              versionName,
              versionCode,
              fileName,
              sha256,
              releaseTag,
              builtAt: new Date().toISOString(),
            };
            const outPath = path.join(releaseDir, 'android-latest.json');
            fs.writeFileSync(outPath, JSON.stringify(metadata, null, 2) + '\n', 'utf8');
            console.log('--- release/android-latest.json ---');
            console.log(fs.readFileSync(outPath, 'utf8').trim());
          EOF
          fi

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kapsula-Android-${{ github.event.inputs.flavor || 'direct' }}-${{ github.event.inputs.format || 'apk' }}
          path: |
            release/*.apk
            release/*.aab
            release/android-latest.json
          retention-days: 30
          if-no-files-found: error

      - name: Ensure GitHub Release exists (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXTRA_ARGS=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --title "Kapsula $RELEASE_TAG" --generate-notes "${EXTRA_ARGS[@]}" || true
          fi

      - name: Attach .apk & android-latest.json to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v') && (github.event.inputs.format || 'apk') == 'apk'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/android-latest.json
