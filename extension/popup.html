<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      width: 312px;
      margin: 0;
      padding: 14px;
      background: #121216;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: #e86a33;
    }
    .conn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #9b9ba6;
      background: #1b1b22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 3px 8px;
    }
    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #71717a;
      transition: background 150ms ease;
    }
    .conn-dot.online {
      background: #2ea06b;
      box-shadow: 0 0 8px rgba(46, 160, 107, 0.55);
    }
    label {
      display: block;
      font-size: 11px;
      color: #9b9ba6;
      margin-bottom: 4px;
    }
    select, textarea {
      width: 100%;
      background: #191920;
      color: #f4f4f6;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      padding: 8px 9px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      margin-bottom: 9px;
      transition: border-color 140ms ease;
    }
    select:focus, textarea:focus {
      border-color: rgba(232, 106, 51, 0.7);
    }
    textarea {
      min-height: 58px;
      resize: none;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      font-weight: 600;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: transform 110ms ease, opacity 140ms ease, background 140ms ease;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .primary {
      grid-column: span 2;
      background: #e86a33;
      color: #ffffff;
      padding: 9px 12px;
    }
    .primary:hover:not(:disabled) { background: #f07742; }
    .secondary {
      background: #1f1f28;
      color: #ececf0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .secondary:hover:not(:disabled) { background: #272733; }
    .vault-btn {
      grid-column: span 2;
      background: rgba(46, 160, 107, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(46, 160, 107, 0.3);
    }
    .vault-btn:hover:not(:disabled) { background: rgba(46, 160, 107, 0.2); }
    .ig-toggle-row {
      margin-top: 10px;
      padding: 8px 9px;
      border-radius: 9px;
      background: #191920;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }
    .ig-toggle-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .ig-toggle-title {
      font-size: 11.5px;
      font-weight: 500;
      color: #ececf0;
    }
    .ig-toggle-sub {
      font-size: 10.5px;
      color: #8b8b96;
    }
    .ig-toggle-row input {
      accent-color: #e86a33;
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #a1a1aa;
      min-height: 15px;
      line-height: 1.35;
    }
    #status.ok { color: #4ade80; }
    #status.err { color: #fb7185; }
    .pair-box {
      display: none;
      margin-bottom: 10px;
      padding: 9px;
      border-radius: 9px;
      background: #191920;
      border: 1px solid rgba(232, 106, 51, 0.35);
    }
    .pair-box.visible { display: block; }
    .pair-row {
      display: flex;
      gap: 6px;
      margin-top: 5px;
    }
    .pair-row input {
      flex: 1;
      background: #121216;
      color: #f4f4f6;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 12px;
      letter-spacing: 0.08em;
      outline: none;
    }
    .pair-row input:focus { border-color: rgba(232, 106, 51, 0.75); }
    .pair-row button {
      background: #e86a33;
      color: #fff;
      padding: 6px 10px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>Kapsula</span>
    </div>
    <div class="conn" id="connBadge">
      <span class="conn-dot" id="connDot"></span>
      <span id="connText">Проверка…</span>
    </div>
  </div>

  <div class="pair-box" id="pairBox">
    <label for="pairCodeInput">Код из Kapsula (Настройки → Интеграции)</label>
    <div class="pair-row">
      <input id="pairCodeInput" type="text" placeholder="Код подключения" autocomplete="off" />
      <button id="pairBtn" type="button">Подключить</button>
    </div>
  </div>

  <label for="orbitSelect">Раздел (необязательно)</label>
  <select id="orbitSelect">
    <option value="">Без раздела (авто)</option>
  </select>

  <label for="note">Заметка к сохранению</label>
  <textarea id="note" placeholder="Короткий комментарий или мысль..."></textarea>

  <div class="actions">
    <button class="primary" id="savePageBtn" type="button">Сохранить страницу</button>
    <button class="secondary" id="saveSelectionBtn" type="button">Выделение</button>
    <button class="secondary" id="saveShotBtn" type="button">Скриншот</button>
    <button class="vault-btn" id="saveSecretBtn" type="button">Сохранить в Сейф</button>
  </div>

  <label class="ig-toggle-row" for="igOverlayToggle">
    <span class="ig-toggle-text">
      <span class="ig-toggle-title">Кнопка в Instagram</span>
      <span class="ig-toggle-sub">Быстрое сохранение постов и «Сохранённого»</span>
    </span>
    <input type="checkbox" id="igOverlayToggle" />
  </label>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
